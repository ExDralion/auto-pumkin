<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <title>Pumpkin Detector</title>
  <style>
    body { width: 340px; margin: 0; padding: 14px; background: #111113; color: #eee; font: 13px/1.4 system-ui, sans-serif; }
    h1 { font-size: 15px; margin: 0 0 4px; }
    .sub { color: #999; font-size: 12px; margin-bottom: 10px; }
    ol { margin: 0; padding-left: 20px; }
    li { margin: 0 0 8px; }
    a { color: #ffb44d; text-decoration: none; font-weight: 600; }
    a:hover { text-decoration: underline; }
    .where { color: #bbb; font-size: 12px; }
    .hint { color: #777; font-size: 11px; font-style: italic; }
    .done { color: #c6ff5e; }
    .row { display: flex; gap: 8px; margin-bottom: 10px; }
    button { flex: 1; padding: 8px; border: 0; border-radius: 8px; background: linear-gradient(135deg, #f2690f, #ffb44d); color: #1a0b02; font: 700 13px system-ui, sans-serif; cursor: pointer; }
    button.ghost { flex: 0 0 auto; background: #2a2a30; color: #ddd; }
    .stat { margin: 8px 0 12px; padding: 8px 10px; border-radius: 8px; background: #1c1c20; }
  </style>
</head>
<body>
  <h1>🎃 Тыквы rscripts.net</h1>
  <div class="sub">Авто-обход сам открывает страницы, находит тыкву и ставит на неё фокус — тебе остаётся нажать <b>Enter</b> (или кликнуть). После засчёта — сразу переход к следующей.</div>
  <div class="row"><button id="tour">▶ Авто-обход</button><button id="stop" class="ghost">■ Стоп</button></div>
  <div class="stat" id="stat">Найдено: —</div>
  <ol id="list"></ol>
  <script src="spots.js"></script>
  <script src="popup.js"></script>
</body>
</html>
